name: auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env: # AWSの認証アクションへ指定する入力パラメータ
  ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ID }}:role/${{ secrets.ROLE_NAME }}
  SESSION_NAME: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  auto-merge:
    name: "CDK diff (no change -> auto merge)"
    runs-on: ubuntu-latest

    # package.jsonを更新するDependabot PR に対してのみ実行
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/')

    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ${{ env.SESSION_NAME }}
          aws-region: ap-northeast-1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # cdk diff --fail: 差分があれば終了コード1で失敗 => 自動マージしない
      # cdk diffは内部的にsynthを実行するため、明示的なsynth不要
      # dev環境のInfraStackのみチェック（Lambda Stackは除外）
      - name: CDK diff (fail on changes)
        run: npx cdk diff --fail -c env=dev -c deployLambda=false 'InfraStack-dev'
        env:
          CI: true

      # ここまで来た = diffに差分なし
      # auto-merge実行
      - name: Enable auto-merge (squash)
        if: ${{ success() }}
        run: |
          gh pr review "${GITHUB_HEAD_REF}" --approve
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
